
services:
  drogon-backend:
    build:
      context: ./weather_app
      dockerfile: Dockerfile
    container_name: drogon_weather_backend
    expose:
      - "8000"

  nginx-server:
    image: nginx:alpine
    container_name: nginx_weather_webserver
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - drogon-backend