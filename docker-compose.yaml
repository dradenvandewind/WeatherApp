services:
  drogon-backend:
    build:
      context: ./weather_app
      dockerfile: Dockerfile
    container_name: drogon_weather_backend
    expose:
      - "8000"                          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]  # ← 8000 not 8080
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s                 # ← 15s to allow Drogon to start

  nginx-server:
    image: nginx:alpine
    container_name: nginx_weather_webserver
    ports:
      - "8080:80"                       # Only Nginx is accessible from the host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      drogon-backend:
        condition: service_healthy      # ← is waiting for Drogon to be healthy before starting
   # =========================
  # 📊 PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - drogon-backend

  # =========================
  # 📈 GRAFANA
  # =========================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # =========================
  # 📈 Monitoring Host
  # =========================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"

  # =========================
  # 📈 Monitoring Container on host
  # =========================

  cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      container_name: cadvisor
      ports:
        - "8081:8080"
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
      restart: unless-stopped

volumes:
  grafana-data: