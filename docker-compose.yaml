services:
  drogon-backend:
    build:
      context: ./weather_app
      dockerfile: Dockerfile
    container_name: drogon_weather_backend
    expose:
      - "8000"                          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]  # ← 8000 not 8080
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s                 # ← 15s to allow Drogon to start

  nginx-server:
    image: nginx:alpine
    container_name: nginx_weather_webserver
    ports:
      - "8080:80"                       # Only Nginx is accessible from the host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      drogon-backend:
        condition: service_healthy      # ← is waiting for Drogon to be healthy before starting