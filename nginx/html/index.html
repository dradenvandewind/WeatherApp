<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ & FastAPI Weather App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { margin-top: 0; color: #2c3e50; }
        .geo-inputs { display: flex; gap: 10px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2980b9; }
        .weather-info { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; display: none; }
        .temp { font-size: 3rem; font-weight: bold; color: #e74c3c; margin: 10px 0; }
        .speech { font-style: italic; color: #7f8c8d; margin-bottom: 15px; }
        .update-tag { font-size: 0.8rem; color: #bdc3c7; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Dynamic Weather</h1>
    <div class="geo-inputs">
        <input type="number" id="lat" step="0.0001" value="48.8566" placeholder="Latitude">
        <input type="number" id="lon" step="0.0001" value="2.3522" placeholder="Longitude">
    </div>
    <button onclick="fetchWeather()">Get weather</button>

    <div id="weather-info" class="weather-info">
        <div id="speech" class="speech"></div>
        <div id="temp" class="temp">--°C</div>
        <div id="wind">Wind: -- km/h</div>
        <div id="update-time" class="update-tag">Last update: --</div>
    </div>
</div>

<script>
    let autoUpdateInterval = null;

    async function fetchWeather() {
        const lat = document.getElementById('lat').value;
        const lon = document.getElementById('lon').value;
        const infoDiv = document.getElementById('weather-info');

        try {
            // Call '/api/weather' because Nginx reverse proxies to FastAPI
            const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
            if (!response.ok) throw new Error('Server error');
            
            const data = await response.json();
            
            document.getElementById('speech').innerText = data.speech;
            document.getElementById('temp').innerText = `${data.current_weather.temperature}°C`;
            document.getElementById('wind').innerText = `Wind: ${data.current_weather.windspeed} km/h (Dir: ${data.current_weather.winddirection}°)`;
            document.getElementById('update-time').innerText = `Updated at: ${new Date().toLocaleTimeString()}`;
            
            infoDiv.style.display = 'block';
        } catch (error) {
            alert("Unable to retrieve weather data.");
            console.error(error);
        }
    }

    // Load initial weather on startup
    window.onload = () => {
        fetchWeather();
        // Set auto-update every 30 seconds (30000 ms)
        if(autoUpdateInterval) clearInterval(autoUpdateInterval);
        autoUpdateInterval = setInterval(fetchWeather, 30000);
    };
</script>
</body>
</html>
